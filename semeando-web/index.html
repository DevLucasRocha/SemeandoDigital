<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semeando Digital - MVP</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Semeando Digital</h1>
            <p>Módulo de Gestão de Contratos</p>
        </header>

        <main>
            <section class="card form-section">
                <h2>Novo Contrato Financeiro</h2>
                <form id="contratoForm">
                    <div class="form-group">
                        <label for="nome">Nome do Aluno</label>
                        <input type="text" id="nome" placeholder="Ex: João Silva" required>
                    </div>

                    <div class="form-group">
                        <label for="matricula">Matrícula</label>
                        <input type="text" id="matricula" placeholder="Ex: 2023001" required>
                    </div>

                    <div class="form-group">
                        <label for="tipoMatricula">Tipo de Matrícula</label>
                        <select id="tipoMatricula" required>
                            <option value="" disabled selected>Selecione uma opção...</option>
                            <option value="infantil">Educação Infantil (Taxa de Associado)</option>
                            <option value="fundamental">Ensino Fundamental (Mensalidade)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="valorParcela">Valor da Parcela</label>
                        <!-- [REFLEXO DO ENCAPSULAMENTO] Campo readonly impede a digitação manual de valores incorretos (ex: R$ 310,00) -->
                        <input type="text" id="valorParcela" value="R$ 0,00" readonly class="locked-input" title="O valor é gerado automaticamente pelo sistema.">
                    </div>

                    <div class="lgpd-notice">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <span><strong>Privacidade:</strong> Dados sensíveis de saúde estão ocultos nesta visualização em conformidade com o Art. 14 da LGPD.</span>
                    </div>

                    <!-- [REFLEXO DO POLIMORFISMO] O mesmo botão dispara ações diferentes dependendo do tipo selecionado -->
                    <button type="submit" class="btn-primary">Gerar Documento</button>
                </form>
            </section>

            <section id="resultadoContainer" class="hidden">
                <!-- O documento gerado aparecerá aqui -->
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
